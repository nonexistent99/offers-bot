services:
  offers-bot:
    build: .
    container_name: offers-bot
    restart: unless-stopped
    ports:
      - "80:3000"
    volumes:
      # Bind-mounts: edições no Windows refletem no container sem rebuild
      - ./src:/app/src
      - ./public:/app/public
      # Volumes NOMEADOS para sobreviver a rebuilds (CRÍTICO):
      - wwebjs_auth:/app/.wwebjs_auth
      - offers_data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=3000
      - TZ=America/Sao_Paulo
      - WA_AUTH_FOLDER=/app/.wwebjs_auth
    tty: true
    stdin_open: true

volumes:
  wwebjs_auth:    # Credenciais WhatsApp — JAMAIS apagar manualmente
  offers_data:    # Banco SQLite — JAMAIS apagar manualmente
