services:
  offers-bot:
    build: .
    container_name: offers-bot
    restart: unless-stopped
    ports:
      - "80:3000"
    volumes:
      # Bind-mounts: edições no Windows refletem no container sem rebuild
      - ./src:/app/src
      - ./public:/app/public
      - ./data:/app/data
      - ./.wwebjs_auth:/app/.wwebjs_auth
    environment:
      - NODE_ENV=production
      - PORT=3000
      - TZ=America/Sao_Paulo
    # Mantém o stdout limpo para acompanhar logs
    tty: true
    stdin_open: true
